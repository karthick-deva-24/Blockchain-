<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/sheryjs/dist/Shery.css" />
    <link rel="stylesheet" href="css/style.css">

<body data-page="404">
    <div id="particles-js"></div>
        <div data-barba="wrapper">

    <div class="wrapper">


        <main class="page-header" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 60vh;">

            <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
                <button onclick="window.history.back();" class="btn-primary" style="font-size: 1.2rem; padding: 1rem 3rem; border: none; cursor: pointer; background: transparent; color: #14b8a6; border: 2px solid #14b8a6;">Back to previous page</button>
                <a href="index.html" class="btn-primary" style="font-size: 1.2rem; padding: 1rem 3rem; background: transparent; border: 2px solid #14b8a6;">Back to home</a>

    </div>
    </div>
        <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
